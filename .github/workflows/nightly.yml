# Nightly build: full test suite + assembleRelease (unsigned) + size report
name: Nightly

on:
  push:
    branches: [ main ]

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  unit-tests:
    name: Full unit test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Windows checkouts can lose the exec bit; guard the wrapper before any ./gradlew call.
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run all unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-reports
          path: '**/build/reports/tests/testDebugUnitTest/**'
          retention-days: 30

  lint:
    name: Lint (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Windows checkouts can lose the exec bit; guard the wrapper before any ./gradlew call.
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint
        run: ./gradlew lint --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-lint-report
          path: '**/build/reports/lint-results-*.html'
          retention-days: 30

  assemble-release:
    name: Assemble release (unsigned)
    runs-on: ubuntu-latest
    needs: [unit-tests, lint]
    steps:
      - uses: actions/checkout@v4

      # Windows checkouts can lose the exec bit; guard the wrapper before any ./gradlew call.
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: nightly-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  size-report:
    name: APK size report
    runs-on: ubuntu-latest
    needs: [assemble-release]
    steps:
      - name: Download debug and release APKs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Report APK sizes
        run: |
          echo "## APK Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for apk in artifacts/debug-apk/*.apk artifacts/nightly-release-apk/*.apk; do
            if [ -f "$apk" ]; then
              size=$(du -h "$apk" | cut -f1)
              echo "| $(basename $apk) | $size |" >> $GITHUB_STEP_SUMMARY
            fi
          done
